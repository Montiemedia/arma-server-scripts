name: Linux

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate shell scripts
        run: bash -n scripts/arma3ctl scripts/start-server.sh scripts/bootstrap.sh tests/test_start_server.sh

      - name: Run project tests
        run: make test

      - name: Run ShellCheck
        run: shellcheck scripts/arma3ctl scripts/start-server.sh scripts/bootstrap.sh tests/test_start_server.sh
