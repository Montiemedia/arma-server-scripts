name: Linux

on:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate shell scripts
        run: bash -n install.sh scripts/arma3ctl scripts/arma3-menu.sh scripts/start-server.sh scripts/bootstrap.sh tests/test_install.sh tests/test_arma3_menu.sh tests/test_remove_mod.sh tests/test_start_server.sh tests/test_arma3ctl_mod_failures.sh

      - name: Run project tests
        run: make test

      - name: Run ShellCheck
        run: shellcheck install.sh scripts/arma3ctl scripts/arma3-menu.sh scripts/start-server.sh scripts/bootstrap.sh tests/test_install.sh tests/test_arma3_menu.sh tests/test_remove_mod.sh tests/test_start_server.sh tests/test_arma3ctl_mod_failures.sh
